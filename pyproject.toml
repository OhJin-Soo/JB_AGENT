[project]
name = "jb-agent"
version = "0.1.0"
description = "AI-based personal cashflow and net-worth analysis service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.60",
    "openai>=1.58.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "playwright>=1.49.0",
    "reportlab>=4.2.5",
    "numpy>=2.0.0",
    "statsmodels>=0.14.4",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32.1",
    "xgboost>=2.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
